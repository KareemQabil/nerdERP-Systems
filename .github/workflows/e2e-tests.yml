name: E2E Tests

on:
  push:
    branches: [main, develop, more-detailed-backend]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nerdpos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Setup backend
        working-directory: ./nestJSBackend
        run: |
          npm ci
          npm run build
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/nerdpos_test" > .env

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Start backend server
        working-directory: ./nestJSBackend
        run: |
          npm run start:dev &
          echo "Backend server started in background"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nerdpos_test
          NODE_ENV: test

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:3000/api/v1/health > /dev/null 2>&1 || curl -s http://localhost:3000/ > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done

      - name: Seed test data
        working-directory: ./nestJSBackend
        run: |
          curl -X POST http://localhost:3000/api/v1/seed/comprehensive || echo "Seed endpoint may not be available"
        env:
          NODE_ENV: test

      - name: Run Playwright tests
        working-directory: ./frontend
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/reports/
          retention-days: 30

      - name: Upload Playwright screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: frontend/e2e/screenshots/
          retention-days: 7

      - name: Upload Playwright videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: frontend/e2e/videos/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/e2e/traces/
          retention-days: 7

  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nerdpos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nestJSBackend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./nestJSBackend
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run E2E tests
        working-directory: ./nestJSBackend
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nerdpos_test

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-coverage
          path: nestJSBackend/coverage/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [frontend-e2e, backend-e2e]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "Frontend E2E: ${{ needs.frontend-e2e.result }}"
          echo "Backend E2E: ${{ needs.backend-e2e.result }}"

          if [ "${{ needs.frontend-e2e.result }}" = "failure" ] || [ "${{ needs.backend-e2e.result }}" = "failure" ]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi
